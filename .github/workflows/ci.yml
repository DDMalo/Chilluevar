name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only the core package and the dev tools. The audio, speech and model
      # extras are deliberately left out: CI must never download a model or
      # reach a provider, so it stays fast, free and deterministic. Engines are
      # tested against fakes that satisfy the protocols in interfaces.py.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest
