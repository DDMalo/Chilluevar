# Copy this file to config/chilluevar.yaml and edit it. The copy is gitignored,
# so your microphone names and device lists stay on your machine.

# "local": one machine does everything.
# "satellite": this machine only handles audio and sends the rest to brain_url.
mode: local
brain_url: null

# When true the assistant refuses to reach the network at all. This is the
# default: everything it needs runs on this machine.
offline_only: true

audio:
  # null means the operating system's default device.
  # List the available ones with: python -m sounddevice
  input_device: null
  output_device: null
  sample_rate: 16000
  frame_ms: 30

wake_word:
  enabled: true
  # A bundled model until we train our own on the name (issue #22).
  model: hey_jarvis
  # Lower it if it misses you, raise it if it wakes up on its own.
  threshold: 0.6
  # onnx or tflite. onnx installs everywhere; tflite needs a runtime that is
  # awkward on Windows.
  framework: onnx

# Where one spoken sentence begins and ends.
listen:
  # How long to wait for you to start talking after the wake word fires.
  start_timeout_ms: 3000
  # Silence that ends a sentence. Too short cuts you off mid-thought, too long
  # adds that much delay to every answer.
  silence_ms: 800
  # Shorter than this is a cough or a door, not a question.
  min_utterance_ms: 400
  # A safety net against a radio left on, not a limit you should ever hit.
  max_utterance_ms: 15000
  # How sure the voice detector has to be that a frame is speech.
  vad_threshold: 0.5

stt:
  engine: faster-whisper
  # tiny / base / small / medium. "small" is the usual balance in Spanish;
  # drop to "base" on a machine without a GPU.
  model: small
  language: es
  # auto / cpu / cuda
  device: auto
  # default / int8 / float16. On CPU, int8 is several times faster and barely
  # less accurate. On a GPU, float16.
  compute_type: default
  # Higher is slightly more accurate and noticeably slower.
  beam_size: 5
  # Words the engine tends to mishear and that matter to us.
  hints:
    - Chilluevar

llm:
  engine: ollama
  # Chosen in docs/decisions/0006-first-language-model.md. Pull it first:
  #   ollama pull qwen3:8b
  model: qwen3:8b
  base_url: http://localhost:11434
  # Spoken answers have to be short, so this is a hard ceiling.
  max_reply_words: 60
  # How many previous exchanges stay in context.
  history_turns: 6
  # 0 always gives the same answer; above 1 it starts to ramble.
  temperature: 0.6
  # How much of the conversation the model can see, in tokens. Too small and
  # the start of the conversation, system prompt included, is silently lost.
  num_ctx: 4096
  # How long the model stays in memory after answering. Reloading it costs
  # seconds. Use -1 to keep it loaded for good.
  keep_alive: 30m
  # Only for models that reason before answering (qwen3, gemma4...): set it to
  # false, or every answer waits for a long hidden reasoning. Set it to null
  # for models that do not reason, such as qwen2.5 or llama3.2.
  think: false

tts:
  engine: piper
  voice: es_ES-sharvard-medium
  # Download the voice with:
  #   python -m piper.download_voices es_ES-sharvard-medium --data-dir models/piper
  voice_dir: models/piper
  # Rewrite numbers, times, symbols and leftover markdown before speaking, so
  # "20:15" is read as "las ocho y cuarto" and not as four digits. Turn it off
  # only to hear exactly what the model produced.
  clean_text: true

# Tools the model may call. A tool that is not listed here cannot run, even if
# the model asks for it.
allowed_tools:
  - get_time

# Ask out loud before anything that deletes, sends, spends or changes the state
# of the flat. Leave this on.
confirm_sensitive: true
