[project]
name = "chilluevar"
version = "0.1.0"
description = "A fully local voice assistant: wake word, speech to text, LLM with tools, and speech synthesis, with no audio leaving the machine."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pyyaml>=6.0",
]

# Heavy, platform-dependent dependencies live in extras so that the core
# package (contracts, event bus, configuration) installs in seconds and CI
# never needs to download a model. See docs/decisions/0003-heavy-dependencies-are-extras.md
[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]
stt = [
    "faster-whisper>=1.0",
    "numpy>=1.26",
]
tts = [
    "piper-tts>=1.2",
]
wake = [
    "openwakeword>=0.6",
]
# Only the HTTP client: the model itself runs in Ollama, outside Python.
llm = [
    "httpx>=0.27",
]
dev = [
    # numpy is not a core dependency, but the tests do arithmetic on audio
    # buffers and CI installs only this extra.
    "numpy>=1.26",
    # The Ollama client is tested against httpx's MockTransport, so the tests
    # need httpx even though CI never talks to a real server.
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[project.scripts]
chilluevar = "chilluevar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chilluevar"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "ASYNC",  # async pitfalls
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ is importable from the tests so the benchmark harness is covered too.
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
